          - name: points
            label: Points clés
            type: object
            list: true
            fields:
              - name: icone
                label: Icône
                type: select
                options:
                  values:
                    - coeur
                    - cadeau
                    - personnes
                    - etincelle
                    - palette
                    - etiquette
                    - globe
                    - horloge
                    - calendrier
                    - lieu
                    - photo
                    - boutique
                    - valise
                    - verre
                    - calques
                    - message
                    - check
              - name: texte
                label: Texte
                type: string
          - name: bouton
            label: Texte du bouton
            type: string
          - name: photo
            label: Photo
            type: image
      - name: autres
        label: Autres ateliers
        type: object
        fields:
          - name: surtitre
            label: Petit titre rose
            type: string
          - name: ateliers
            label: Ateliers
            type: object
            list: true
            fields:
              - name: titre
                label: Titre
                type: string
              - name: texte
                label: Texte
                type: text
              - name: bouton
                label: Bouton
                type: string
              - name: lien
                label: Lien
                type: string
              - name: photo
                label: Photo
                type: image
      - name: realisations
        label: Réalisations
        type: object
        fields:
          - name: surtitre
            label: Petit titre rose
            type: string
          - name: titre
            label: Titre
            type: string
            description: 'Astuce : mettez un mot entre *étoiles* pour l''afficher en italique rose.'
          - name: bouton
            label: Texte du bouton
            type: string
        description: Les projets affichés se choisissent dans « 7 · Réalisations » (case « Afficher sur l'accueil »).
      - name: cta
        label: Bandeau final
        type: object
        fields:
