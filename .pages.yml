                label: Nombre
                type: string
              - name: texte
                label: Texte
                type: string
          - name: destinations
            label: Destinations
            type: string
      - name: references_titre
        label: Titre au-dessus des logos
        type: string
      - name: pourquoi
        label: Pourquoi ça marche
