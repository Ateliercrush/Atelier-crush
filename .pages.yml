            label: Petit titre rose
            type: string
          - name: titre
            label: Titre
            type: string
            description: 'Astuce : mettez un mot entre *étoiles* pour l''afficher en italique rose.'
          - name: liste
            label: Arguments
            type: object
            list: true
            fields:
              - name: icone
                label: Icône
                type: select
                options:
                  values:
                    - coeur
                    - cadeau
                    - personnes
                    - etincelle
                    - palette
                    - etiquette
                    - globe
                    - horloge
                    - calendrier
                    - lieu
                    - photo
                    - boutique
                    - valise
                    - verre
                    - calques
                    - message
                    - check
              - name: titre
                label: Titre
                type: string
              - name: texte
                label: Texte
                type: text
      - name: signature
        label: Offre signature (bijou de sac)
