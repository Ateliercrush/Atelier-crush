# Configuration de l'interface d'admin (Pages CMS, https://app.pagescms.org)
media:
  input: photos
  output: /photos
  extensions:
    - jpg
    - jpeg
    - png
    - webp
    - svg
content:
  - name: general
    label: Réglages généraux (menu, logos, pied de page)
    type: file
    path: contenu/general.yml
    fields:
      - name: logo
        label: Logo Atelier Crush
        type: image
      - name: menu
        label: Menu
        type: object
        list: true
        fields:
          - name: texte
            label: Texte
            type: string
          - name: lien
            label: Lien (vide si sous-menu)
            type: string
          - name: sous_menu
            label: Sous-menu (facultatif)
            type: object
            list: true
            fields:
              - name: texte
                label: Texte
                type: string
              - name: lien
                label: Lien
                type: string
      - name: bouton_devis
        label: Bouton du menu
        type: string
      - name: references
        label: Logos clients
        type: object
        list: true
        fields:
          - name: nom
            label: Nom de la marque
            type: string
          - name: logo
            label: Logo (facultatif, sinon le nom s'affiche)
            type: image
      - name: footer
        label: Pied de page
        type: object
        fields:
          - name: accroche
            label: Phrase sous le logo
            type: string
          - name: titre_liens
            label: Titre des liens
            type: string
          - name: titre_contact
            label: Titre contact
            type: string
          - name: email
            label: Email
            type: string
          - name: instagram
            label: Nom Instagram
            type: string
          - name: lien_instagram
            label: Lien Instagram
            type: string
          - name: whatsapp
            label: Numéro WhatsApp affiché
            type: string
          - name: lien_whatsapp
            label: Lien WhatsApp (https://wa.me/33…)
            type: string
          - name: cta_texte
            label: Phrase de l'encart rose
            type: string
          - name: cta_bouton
            label: Bouton de l'encart rose
            type: string
  - name: accueil
    label: 1 · Accueil
    type: file
    path: contenu/accueil.yml
    fields:
      - name: seo
        label: Référencement Google
        type: object
