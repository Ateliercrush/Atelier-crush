            label: Petit titre rose
            type: string
          - name: titre
            label: Titre
            type: string
            description: 'Astuce : mettez un mot entre *étoiles* pour l''afficher en italique rose.'
          - name: texte
            label: Texte
            type: text
            description: Laissez une ligne vide pour créer un nouveau paragraphe.
          - name: bouton
            label: Texte du bouton
            type: string
          - name: photo
            label: Photo
            type: image
