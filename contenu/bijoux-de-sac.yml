seo:
  titre: Atelier bijoux de sac personnalisé pour vos événements | Atelier Crush
  description: "Animation bijoux de sac : chaque invité compose son grigri parmi une large sélection de charms, perles et pompons. Personnalisable aux couleurs, au logo ou au produit de votre marque. De 5 à 200 participants."
hero:
  surtitre: Atelier signature
  titre: Le bijou de sac personnalisé
  texte: |
    Une animation participative où chaque invité compose son propre grigri parmi une large sélection de pièces.
    Coloré, chic, décalé ou minimal : chacun crée celui qui lui ressemble.
  bouton: Demander un devis
  photo: /photos/ateliers/charms-plateau-fleurs.jpg
etapes:
  surtitre: Comment ça marche ?
  titre: Une expérience en trois étapes.
  liste:
    - titre: Je choisis
      texte: L'invité découvre la sélection de charms, perles, pompons et breloques et choisit les pièces qui lui plaisent.
      photo: /photos/benefit/choix-des-charms-mains.jpg
    - titre: Je compose
      texte: Il imagine son bijou de sac. Notre équipe l'accompagne dans sa sélection et réalise l'assemblage si besoin.
      photo: /photos/ateliers/atelier-assemblage.jpg
    - titre: Je repars avec
      texte: Quelques minutes plus tard, son bijou est prêt. Il repart avec une création personnelle, directement utilisable.
      photo: /photos/ateliers/invitee-bijou-de-sac.jpg
infos:
  titre: Informations pratiques
  liste:
    - icone: personnes
      texte: De 5 à 200 participants
    - icone: horloge
      texte: Environ 3 à 15 minutes par invité
    - icone: calendrier
      texte: Animations généralement organisées sur 3 à 4 heures
    - icone: coeur
      texte: Notre équipe anime l'atelier sur place
    - icone: globe
      texte: Déplacements en France et à l'étranger
personnalisation:
  surtitre: Sur mesure
  titre: Votre événement. Votre univers. Leurs créations.
  intro: L'atelier peut être entièrement adapté à votre projet.
  liste:
    - titre: Les couleurs
      texte: Nous sélectionnons les pièces en cohérence avec votre univers, votre charte ou votre produit.
      photo: /photos/eden-gallery/eden-plateaux-rouges.jpg
    - titre: Le thème
      texte: "Lancement, collection, saison, fête, destination : la sélection peut être construite autour de votre événement."
      photo: /photos/eden-gallery/eden-dubai-table.jpg
    - titre: Les pièces sur mesure
      texte: "Logo, produit, message ou symbole : des pièces spécifiques peuvent être produites lorsque les délais le permettent."
      photo: /photos/eden-gallery/eden-charm-sur-mesure.jpg
    - titre: Votre produit
      texte: Selon le projet, le produit de la marque peut lui-même devenir une partie de la création.
      photo: /photos/loreal-redken/redken-produits-et-charms.jpg
  bouton: Parlez-nous de votre projet
cas_client:
  surtitre: Cas client
  titre: Benefit · Bad Gal Bounce
  texte: |
    Pour le lancement du mascara Bad Gal Bounce, l'atelier a été pensé autour de l'univers Benefit.

    Couleurs, sélection des pièces et créations ont été intégrées au décor de la soirée. Le produit pouvait également accompagner directement la création de l'invité.

    Résultat : chacun repart avec le produit du lancement et une création personnelle associée à l'événement.
  bouton: Découvrir nos réalisations
  photo: /photos/benefit/benefit-stand-bad-gal-bounce.jpg
usages:
  titre: Idéal pour
  liste:
    - Lancements de produit
    - Soirées clients et VIP
    - Activations en boutique
    - Événements presse
    - Séminaires
    - Team building
    - Événements collaborateurs
    - Mariages
    - Bar & Bat Mitzvah
cta:
  titre: Imaginons votre atelier.
  texte: Chaque événement est différent. Racontez-nous le vôtre et nous vous proposerons une expérience adaptée.
  bouton: Demander un devis
