seo:
  titre: Nos réalisations | Atelier Crush
  description: "Benefit, American Vintage, Redken, Eden Gallery, C&A : découvrez
    les ateliers imaginés par Atelier Crush pour les marques, les entreprises et
    les événements privés."
hero:
  surtitre: Nos réalisations
  titre: Chaque événement donne naissance à un atelier différent.
  texte: "Marques, entreprises, agences et événements privés : découvrez quelques
    projets imaginés par Atelier Crush."
