seo:
  titre: Animation mariage, Bar et Bat Mitzvah | Atelier Crush
  description: "Un moment à partager, un cadeau qu'on garde : un atelier bijoux pendant votre mariage, Bar ou Bat Mitzvah, et chaque invité repart avec sa propre création."
hero:
  surtitre: Événements privés
  titre: Un moment à partager, un cadeau qu'on garde.
  texte: "Mariage, Bar ou Bat Mitzvah : Atelier Crush installe une animation créative pendant votre fête et chaque invité repart avec sa propre création."
  bouton: Demander un devis
  photo: /photos/evenements-prives/sans-titre-981.jpg
occasions:
  - titre: Mariages
    texte: |
      Pendant le cocktail ou la soirée, vos invités composent leur création et repartent avec un cadeau qu'ils ont réellement choisi.

      L'atelier peut reprendre les couleurs et l'univers de votre mariage.
    bouton: Découvrir
    lien: "#nos-fetes"
    photo: /photos/bracelets-colliers/colliers-presentoirs-jardin.jpg
  - titre: Bar & Bat Mitzvah
    texte: |
      Bracelets, colliers ou bijoux de sac : une animation qui plaît aux jeunes comme aux adultes.

      Chaque invité choisit son propre bijou, le personnalise et repart avec un souvenir de la fête.
    bouton: Découvrir
    lien: "#nos-fetes"
    photo: /photos/a-trier/20260226_111149-2.jpg
