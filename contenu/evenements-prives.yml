seo:
  titre: Animation mariage, Bar et Bat Mitzvah | Atelier Crush
  description: "Un moment à partager, un cadeau qu'on garde : un atelier bijoux pendant votre mariage, Bar ou Bat Mitzvah, et chaque invité repart avec sa propre création."
hero:
  surtitre: Événements privés
  titre: Un moment à partager, un cadeau qu'on garde.
  texte: "Mariage, Bar ou Bat Mitzvah : Atelier Crush installe une animation créative pendant votre fête et chaque invité repart avec sa propre création."
  bouton: Demander un devis
