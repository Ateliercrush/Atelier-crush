occasions:
  - titre: Mariages
    texte: |
      Pendant le cocktail ou la soirée, vos invités composent leur création et repartent avec un cadeau qu'ils ont réellement choisi.

      L'atelier peut reprendre les couleurs et l'univers de votre mariage.
    bouton: Découvrir
    lien: /realisations/#evenements-prives
    photo: ""
  - titre: Bar & Bat Mitzvah
    texte: |
      Bracelets, colliers ou bijoux de sac : une animation qui plaît aux jeunes comme aux adultes.

      Chaque invité choisit son propre bijou, le personnalise et repart avec un souvenir de la fête.
    bouton: Découvrir
    lien: /realisations/#evenements-prives
    photo: /photos/fete-privee-table.jpg
