seo:
  titre: Animation pour agences événementielles et de communication | Atelier Crush
  description: "Une animation pour votre prochain brief ? Bijoux de sac, bijoux personnalisés et colorimétrie : personnalisable, de 5 à 200 participants, France et international, marque blanche possible."
hero:
  surtitre: Pour les agences événementielles & de communication
